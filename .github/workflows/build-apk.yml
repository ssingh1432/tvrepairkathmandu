name: Build TRK YouTube TV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply proven v0.6 playback foundation
        run: python3 tools/patch_v060.py

      - name: Apply v0.6.1 persistence and professional TV UI refinement
        run: python3 tools/patch_v061.py

      - name: Restore stable development signing key
        run: base64 -d .github/trk-dev.jks.b64 > trk-dev.jks

      - name: Configure stable debug signing
        run: |
          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  trkStable {
                      storeFile file("../trk-dev.jks")
                      storePassword "trkdev2026"
                      keyAlias "trkdev"
                      keyPassword "trkdev2026"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.trkStable
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK integrity and signature
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256.txt

      - name: Prepare deliverable
        run: |
          mkdir -p deliverable
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/TRK_YouTube_TV_v0.6.1_PRO_TV_UI.apk
          cp app/build/outputs/apk/debug/SHA256.txt deliverable/SHA256.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: TRK_YouTube_TV_v0.6.1_PRO_TV_UI_VERIFIED
          path: deliverable/
          if-no-files-found: error
